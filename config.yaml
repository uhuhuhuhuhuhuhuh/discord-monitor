monitor:
  alert_threshold: 35
  incident_threshold: 80
  log_content_max_chars: 500
  dedupe_window_seconds: 1800
  alert_cooldown_seconds: 120
  incident_window_minutes: 10
  incident_repeat_threshold: 3
  outgoing_velocity_window_seconds: 300
  outgoing_velocity_threshold: 12
  repeated_message_threshold: 4

rules:
  suspicious_tlds: [tk, ml, ga, cf, gq, zip, mov]
  suspicious_domain_keywords: [gift, free, nitro, steam, verify, claim, support]
  suspicious_phrases: [claim now, verify your account, account suspended, your account is suspended, urgent action required, reset your password, appeal your ban, free nitro]
  url_shorteners: [bit.ly, tinyurl.com, t.co, is.gd, cutt.ly, shorturl.at]
  risky_extensions: [exe, scr, bat, cmd, ps1, js, vbs, msi, lnk, jar, reg, iso]
  brand_keywords: [discord, steam, paypal, microsoft, google]
  allow_domains: [discord.com, discordapp.com, steamcommunity.com, steampowered.com]
  deny_domains: []

scoring:
  suspicious_tld: 20
  domain_keyword: 12
  social_engineering_phrase: 25
  shortener: 12
  ip_url: 20
  punycode: 25
  url_userinfo: 25
  unusual_port: 15
  brand_impersonation: 35
  denylisted_domain: 80
  risky_attachment: 40
  double_extension: 35
  secret_leak: 60
  outgoing_multiplier: 1.35
  new_contact: 10
  repeated_message: 25
  high_velocity: 35
  rapid_guild_joins: 40
  dm_context: 10
  new_account: 15
  incident_cluster: 25

features:
  webui: true
  inventory_backups: true

backup:
  snapshot_on_connect: true
  include_message_content: false
  directory: /app/backups

restore:
  target_minutes: 30
  minimum_target_minutes: 20
  maximum_target_minutes: 40
  platform_relationship_actions: manual

webui:
  host: 0.0.0.0
  port: 8080
